# Nginx Konfiguration für AetherHost (Reverse Proxy mit SSL & WebSockets)
# Speicherpfad auf dem Server: /etc/nginx/sites-available/aetherhost.conf

server {
    listen 80;
    server_name mein-hosting.de *.mein-hosting.de;

    # Weiterleitung auf HTTPS (nach Let's Encrypt / Certbot Setup)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Real IP & Forward Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
